[project]
name = "deep-daily-report"
version = "0.2.0"
description = "Standalone deep daily digest pipeline — full-featured, self-use edition (ISSUE-201)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "markdown>=3.6",
    "feedparser>=6.0",
]

[project.optional-dependencies]
news6551 = ["httpx>=0.27"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
deep-daily = "deep_daily.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
