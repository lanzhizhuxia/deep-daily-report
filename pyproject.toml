[project]
name = "deep-daily-report"
version = "0.3.0"
description = "Deep daily digest generator — multi-instance architecture (one tool, many HOMEs via `deep-daily init <path>`)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "markdown>=3.6",
    "feedparser>=6.0",
    "mcp>=1.26,<2.0",
    "sqlite-utils>=3.36",
]

[project.optional-dependencies]
news6551 = ["httpx>=0.27"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
deep-daily = "deep_daily.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "hard_gate_1: bootstrap correctness (import safety + double init)",
    "hard_gate_2: path and cache discipline (identity grep + dry-run isolation)",
    "hard_gate_3: end-to-end smoke",
]
