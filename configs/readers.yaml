# readers.yaml — DEPRECATED (v0.2 multi-reader configuration)
#
# ⚠️ DO NOT USE. This file is a v0.2 artifact kept only for archaeological
# reference. The multi-reader model (one process, many readers via a shared
# readers.yaml) was removed in v0.3.0.
#
# In v0.3.0+, each "reader" is its own instance with its own HOME directory:
#   deep-daily init ~/.my-reader            # create a fresh HOME
#   deep-daily --home ~/.my-reader run      # run this reader
#   deep-daily --home ~/.other-reader run   # run a different reader
#
# The fields that used to live here are now split across each HOME's:
#   - config.yaml    (reader.name, reader.notify.*, pipeline.*, models.*, publisher.*)
#   - configs/profile.yaml
#   - configs/topics.yaml
#   - configs/kols.json
#   - configs/active-systems.yaml
#
# Migration: see docs/migration-guide.md.
#
# The file is left in the repo (not deleted) so that:
#   1. `git log configs/readers.yaml` remains searchable for people tracing
#      v0.2 → v0.3 history.
#   2. Anyone who still has an old `--readers configs/readers.yaml` command
#      in their cron/launchd will get a loud YAML that tells them to migrate,
#      not a silent "file not found".
#
# DO NOT pass this file to any v0.3.0+ CLI. It is not read by the current tool.

deprecated: true
deprecated_since: "0.3.0"
replacement: "per-instance HOME directories — see docs/getting-started.md"
